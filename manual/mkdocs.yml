site_name: Manual do Usuario - GeoLimites
site_description: Manual operacional do sistema GeoLimites
site_author: Equipe GeoLimites
site_url: https://ajuda.geolimites.com.br/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Introducao:
      - Visao Geral: 01-introducao/visao-geral.md
      - Primeiro Acesso e Login: 02-primeiros-passos/primeiro-acesso-e-login.md
  - Operacao:
      - Imoveis: 03-fluxo-operacional/imoveis-e-arquivos-tecnicos.md
      - Normas e Templates: 04-memorial/visualizador-normas-e-geracao.md
      - Arquivos DXF: 03-fluxo-operacional/imoveis-e-arquivos-tecnicos.md
      - Visualizador: 04-memorial/visualizador-normas-e-geracao.md
  - Preparacao:
      - Cadastrar Imovel: 03-fluxo-operacional/imoveis-e-arquivos-tecnicos.md
  - Configuracao:
      - Normas e Exemplos: 05-modelos-e-normas/modelos-documentais-e-normas.md
  - Conta e Acesso:
      - Conta: 06-conta/conta-creditos-e-seguranca.md
      - Administracao: 07-administracao/empresa-smtp-e-usuarios.md
      - Sair: 02-primeiros-passos/primeiro-acesso-e-login.md
  - Suporte:
      - Ajuda Contextual e F1: 08-suporte/ajuda-contextual-e-f1.md
      - FAQ e Proximos Passos: 08-suporte/faq-e-proximos-passos.md
