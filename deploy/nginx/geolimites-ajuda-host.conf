#
# Template base do host da ajuda.
# Depois de copiar este arquivo para /etc/nginx/sites-available/geolimites-ajuda.conf
# em um servidor real, rode novamente:
#   certbot --nginx -d ajuda.geolimites.com.br
# Isso e importante porque o Certbot injeta/atualiza o bloco HTTPS do arquivo ativo.
#
server {
    listen 80;
    listen [::]:80;
    server_name ajuda.geolimites.com.br;

    root /var/www/geolimites-ajuda;
    index index.html;

    access_log /var/log/nginx/geolimites-ajuda.access.log;
    error_log /var/log/nginx/geolimites-ajuda.error.log;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
